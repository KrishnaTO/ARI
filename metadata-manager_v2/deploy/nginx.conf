# /etc/nginx/sites-available/ari-mm  (symlink into sites-enabled)
# HTTP-only to start. Run:  sudo certbot --nginx -d your-domain
# certbot then adds the `listen 443 ssl` block, cert paths, and 80->443 redirect.
server {
    listen 80;
    server_name editor.example.com;     # <-- replace with your real domain

    location ~ /\.(git|env) { deny all; return 404; }
    location ~ /\.          { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
